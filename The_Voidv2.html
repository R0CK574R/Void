<script>
/* ============================================================
   VOID v1.1.0 — MOBILE / STORE BUILD (PROTOTYPE)
   -------------------------------------------------------------
   IAP INTEGRATION POINTS — search these tags:
     [IAP]      -> StoreKit purchase call goes here
     [STORAGE]  -> swap to native secure storage / server
     [ADS]      -> rewarded ad SDK call
     [ODDS]     -> Apple Guideline 3.1.1 requires these be shown
                   BEFORE purchase. Do not remove the odds table.
   NOTE: currency balances here are CLIENT-SIDE for prototyping.
   Production must validate receipts + hold balances server-side.
   ============================================================ */
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
let W,H,DPR=Math.min(window.devicePixelRatio||1,2);
function rsz(){
  W=window.innerWidth;H=window.innerHeight;
  cvs.width=W*DPR;cvs.height=H*DPR;cvs.style.width=W+'px';cvs.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0)
}
rsz();window.addEventListener('resize',rsz);
cvs.addEventListener('contextmenu',e=>e.preventDefault());
const TOUCH=('ontouchstart'in window)||navigator.maxTouchPoints>0;

// ============ SKIN CATALOG (cosmetic only — zero stat effect) ============
const RAR={common:{n:'COMMON',c:'#8a8a8a'},rare:{n:'RARE',c:'#3a7fd5'},epic:{n:'EPIC',c:'#9b4dcc'},legendary:{n:'LEGENDARY',c:'#e8a020'}};
const SKINS={
  saucer:   {name:'CLASSIC SAUCER',rar:'common',   price:0,   hull:['#ffffff','#c8ccd4','#6b7280'],dome:['#ffffff','#8895a8'],core:'#ff0000',lit:'#ff2222',thr:'#ff3333'},
  crimson:  {name:'CRIMSON',       rar:'common',   price:250, hull:['#ff8080','#a02020','#3a0808'],dome:['#ffb0b0','#802020'],core:'#ff2200',lit:'#ff5555',thr:'#ff2200'},
  rust:     {name:'RUSTHULK',      rar:'common',   price:250, hull:['#d9a066','#8a5a2b','#3a2410'],dome:['#e8c090','#7a5030'],core:'#ff7a10',lit:'#ffaa33',thr:'#ff8811'},
  voidsteel:{name:'VOIDSTEEL',     rar:'rare',     price:600, hull:['#b0b6d0','#4a4f6a','#16182a'],dome:['#c8ccf0','#5a5f80'],core:'#8844ff',lit:'#aa66ff',thr:'#7733ee'},
  bone:     {name:'BONE',          rar:'rare',     price:600, hull:['#f4ecd8','#c9bb99','#5a5040'],dome:['#fffaf0','#b0a488'],core:'#66ff88',lit:'#88ffaa',thr:'#55dd77'},
  nova:     {name:'NOVA',          rar:'epic',     price:1200,hull:['#ffffff','#a8d8ff','#2a5a90'],dome:['#ffffff','#88c0f0'],core:'#00ddff',lit:'#66eeff',thr:'#00ccff'},
  heartblood:{name:'HEARTBLOOD',   rar:'legendary',price:2500,hull:['#ff5555','#8a0000','#2a0000'],dome:['#ff8888','#600000'],core:'#ff0033',lit:'#ff3344',thr:'#cc0022',organic:true},
  phantom:  {name:'PHANTOM',       rar:'legendary',price:2500,hull:['#e8f4ff','#7a9ab0','#1a2a35'],dome:['#ffffff','#90b0c8'],core:'#ccffff',lit:'#aaddee',thr:'#88ccdd',ghost:true}
};

// ============ ITEM CATALOG (consumables) ============
const ITEMS={
  chance:{name:'SECOND CHANCE',price:150,desc:'Revive once, no ad'},
  charge:{name:'OVERCHARGE',    price:120,desc:'+40% fire rate, one run'},
  hull:  {name:'REINFORCED HULL',price:180,desc:'Start with 7 integrity'}
};

// ============ [ODDS] VOID CACHE — MUST STAY VISIBLE ============
const CACHE_PRICE=300;
const CACHE_ODDS=[['common',.60],['rare',.28],['epic',.095],['legendary',.025]];
const PITY_AT=20;              // guaranteed epic+ on the 20th open without one
const DUPE_REFUND={common:60,rare:150,epic:400,legendary:900};

// ============ META STATE ============
let meta={shards:500,owned:['saucer'],equip:'saucer',items:{chance:0,charge:0,hull:0},pity:0,best:0,opens:0};
// [STORAGE] prototype persistence. Production: native keychain + server ledger.
(async()=>{try{if(window.storage){const r=await window.storage.get('void_meta');if(r&&r.value)meta=Object.assign(meta,JSON.parse(r.value))}}catch(e){}})();
async function saveMeta(){try{if(window.storage)await window.storage.set('void_meta',JSON.stringify(meta))}catch(e){}}

// ============ AUDIO ============
let AC=null,master=null,muted=false,noiseBuf=null;
function initAudio(){
  if(AC)return;
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=muted?0:.9;master.connect(AC.destination);
    const len=AC.sampleRate;noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const g=AC.createGain();g.gain.value=.045;
    const o1=AC.createOscillator();o1.type='sine';o1.frequency.value=48;
    const o2=AC.createOscillator();o2.type='sine';o2.frequency.value=48.7;
    const lfo=AC.createOscillator();lfo.frequency.value=.06;
    const lg=AC.createGain();lg.gain.value=.02;
    lfo.connect(lg);lg.connect(g.gain);o1.connect(g);o2.connect(g);g.connect(master);
    o1.start();o2.start();lfo.start()
  }catch(e){}
}
function setMute(m){muted=m;if(master)master.gain.value=m?0:.9}
function tone(f0,f1,dur,type,vol,delay){
  if(!AC)return;const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02)
}
function noiseHit(dur,vol,freq,delay){
  if(!AC)return;const t=AC.currentTime+(delay||0);
  const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
  const f=AC.createBiquadFilter();f.type='lowpass';
  f.frequency.setValueAtTime(freq,t);f.frequency.exponentialRampToValueAtTime(80,t+dur);
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+.02)
}
const S={
  shoot(){tone(700+Math.random()*300,180,.07,'square',.028)},
  hit(){noiseHit(.05,.05,2200)},
  kill(){tone(150,40,.16,'sawtooth',.1);noiseHit(.18,.12,900)},
  boom(){tone(90,28,.32,'sine',.2);noiseHit(.38,.26,650)},
  pulse(){tone(320,55,.3,'sine',.16);noiseHit(.32,.2,2600)},
  hurt(){tone(420,90,.22,'sawtooth',.2)},
  die(){tone(280,26,.85,'sawtooth',.24);noiseHit(.7,.2,500)},
  roar(){tone(60,150,.5,'sawtooth',.2);noiseHit(.5,.14,300)},
  bossTick(){noiseHit(.04,.04,1800)},
  beam(){tone(1200,300,.45,'sawtooth',.09);noiseHit(.45,.12,3500)},
  spawnS(){tone(120,60,.25,'sine',.12);noiseHit(.2,.1,400)},
  spit(){for(let i=0;i<3;i++)tone(500,200,.08,'square',.08,i*.05)},
  burst(){noiseHit(.25,.18,1800);tone(200,80,.2,'square',.12)},
  revive(){tone(180,760,.5,'sine',.16);tone(240,900,.5,'sine',.1,.08)},
  ui(){tone(640,880,.05,'square',.06)},
  buy(){tone(500,1000,.12,'sine',.12);tone(700,1400,.12,'sine',.08,.1)},
  deny(){tone(200,120,.15,'square',.1)},
  wave(){tone(110,170,.12,'square',.06)},
  bestS(){tone(400,800,.15,'sine',.12);tone(500,1000,.15,'sine',.1,.12)},
  cacheOpen(){tone(120,600,.9,'sine',.1);noiseHit(.9,.08,1200)},
  reveal(r){const f={common:400,rare:600,epic:800,legendary:1000}[r];tone(f,f*2,.35,'sine',.16);tone(f*1.5,f*3,.35,'sine',.1,.1)}
};

// ============ BACKDROP ============
const STARS=Array.from({length:200},()=>({fx:Math.random(),fy:Math.random(),r:.1+Math.random()*1.6,bright:.22+Math.random()*.78,tw:Math.random()*Math.PI*2,tsp:.003+Math.random()*.018,h:Math.random()<.19?Math.random()*18:Math.random()<.09?215+Math.random()*35:-1,s:60+Math.random()*40,l:44+Math.random()*56}));
const NEBULAS=Array.from({length:9},()=>({fx:Math.random(),fy:Math.random(),fr:.07+Math.random()*.24,hue:[0,310,0,345,255,0,325,0,10][~~(Math.random()*9)],al:.007+Math.random()*.021}));

const keys={},mouse={x:300,y:200};
let gs='menu',fc=0,sc,mul,wv,pCd,sCd,sTm,wPz,shA,shD;
let pl,blts,enms,pts,pls,wvQ,wi;
let boss,bbz,bossWave,usedRevive,reviveT,adT,newBest=false;
let shopTab='skins',toast='',toastT=0,cacheAnim=null,runMods={charge:false,hull:false,chance:false};
let scrollY=0;

// ============ TOUCH ============
const stick={active:false,id:null,ox:0,oy:0,x:0,y:0};
let pulseTouchId=null;
function pulseBtnRect(){const r=44;return{x:W-r-30,y:H-r-40,r}}
function touchXY(t){const r=cvs.getBoundingClientRect();return{x:t.clientX-r.left,y:t.clientY-r.top}}
cvs.addEventListener('touchstart',e=>{
  e.preventDefault();initAudio();if(AC&&AC.state==='suspended')AC.resume();
  for(const t of e.changedTouches){
    const p=touchXY(t);
    if(gs!=='play'){handleTap(p.x,p.y);continue}
    const pb=pulseBtnRect();
    if(Math.hypot(p.x-pb.x,p.y-pb.y)<pb.r+14){pulseTouchId=t.identifier;doPulse();continue}
    if(p.x<W*.55&&!stick.active){stick.active=true;stick.id=t.identifier;stick.ox=p.x;stick.oy=p.y;stick.x=p.x;stick.y=p.y}
  }
},{passive:false});
cvs.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){if(t.identifier===stick.id){const p=touchXY(t);stick.x=p.x;stick.y=p.y}}
},{passive:false});
cvs.addEventListener('touchend',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===stick.id){stick.active=false;stick.id=null}
    if(t.identifier===pulseTouchId)pulseTouchId=null
  }
},{passive:false});

// ============ INPUT ============
document.addEventListener('keydown',e=>{
  keys[e.code]=1;
  if(e.code==='Space'){e.preventDefault();doPulse()}
  if(e.code.indexOf('Arrow')===0)e.preventDefault();
  if(e.code==='KeyM')setMute(!muted);
  if(e.code==='KeyP'||e.code==='Escape'){e.preventDefault();if(gs==='play')gs='pause';else if(gs==='pause')gs='play';else if(gs==='shop')gs='menu'}
  if(e.code==='KeyR'&&(gs==='over'||gs==='pause')){initAudio();S.ui();fc=0;startGame()}
});
document.addEventListener('keyup',e=>{delete keys[e.code]});
cvs.addEventListener('mousemove',e=>{const r=cvs.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top});
cvs.addEventListener('wheel',e=>{if(gs==='shop'){scrollY=Math.max(0,scrollY+e.deltaY*.5)}},{passive:true});
window.addEventListener('blur',()=>{if(gs==='play')gs='pause'});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&gs==='play')gs='pause'});
cvs.addEventListener('click',e=>{
  if(TOUCH)return;
  initAudio();if(AC&&AC.state==='suspended')AC.resume();
  const r=cvs.getBoundingClientRect();handleTap(e.clientX-r.left,e.clientY-r.top)
});

const inR=(x,y,R)=>R&&x>R.x&&x<R.x+R.w&&y>R.y&&y<R.y+R.h;

function handleTap(x,y){
  if(gs==='play'||gs==='ad')return;
  if(gs==='cache'){if(cacheAnim&&cacheAnim.t>150){cacheAnim=null;gs='shop'}return}
  if(gs==='menu'){
    const R=menuRects();
    if(inR(x,y,R.play)){S.ui();fc=0;startGame()}
    else if(inR(x,y,R.shop)){S.ui();gs='shop';shopTab='skins';scrollY=0}
    else if(inR(x,y,R.sound)){S.ui();setMute(!muted)}
    return
  }
  if(gs==='shop'){handleShopTap(x,y);return}
  if(gs==='pause'){
    const R=pauseRects();
    if(inR(x,y,R.resume)){S.ui();gs='play'}
    else if(inR(x,y,R.sound)){S.ui();setMute(!muted)}
    else if(inR(x,y,R.restart)){S.ui();startGame()}
    else if(inR(x,y,R.quit)){S.ui();endRun();gs='menu'}
    return
  }
  if(gs==='revive'){
    const R=reviveRects();
    if(R.free&&inR(x,y,R.free)){S.ui();meta.items.chance--;saveMeta();doRevive()}
    else if(inR(x,y,R.yes)){S.ui();startAd()}
    else if(inR(x,y,R.no)){S.ui();endRun()}
    return
  }
  if(gs==='over'){
    const R=overRects();
    if(inR(x,y,R.again)){S.ui();fc=0;startGame()}
    else if(inR(x,y,R.shop)){S.ui();gs='shop';shopTab='skins';scrollY=0}
    else if(inR(x,y,R.menu)){S.ui();gs='menu'}
    return
  }
}

// ============ SHOP ============
function shopTabRects(){
  const tabs=['skins','items','cache','shards'],tw=Math.min(W-24,420)/4,x0=W/2-tw*2;
  const o={};tabs.forEach((t,i)=>o[t]={x:x0+i*tw,y:64,w:tw-3,h:30});return o
}
function shopBackRect(){return{x:12,y:14,w:70,h:28}}
function cardRects(n){
  const cw=Math.min(W-28,440),x=W/2-cw/2,ch=66,gap=8,y0=112-scrollY;
  return Array.from({length:n},(_,i)=>({x,y:y0+i*(ch+gap),w:cw,h:ch}))
}
function handleShopTap(x,y){
  if(inR(x,y,shopBackRect())){S.ui();gs='menu';return}
  const T=shopTabRects();
  for(const k in T)if(inR(x,y,T[k])){S.ui();shopTab=k;scrollY=0;return}
  if(shopTab==='skins'){
    const R=cardRects(SKIN_IDS.length);
    SKIN_IDS.forEach((id,i)=>{
      if(!inR(x,y,R[i]))return;
      if(meta.owned.includes(id)){meta.equip=id;S.buy();notify('EQUIPPED: '+SKINS[id].name);saveMeta()}
      else if(meta.shards>=SKINS[id].price){meta.shards-=SKINS[id].price;meta.owned.push(id);meta.equip=id;S.buy();notify('UNLOCKED: '+SKINS[id].name);saveMeta()}
      else{S.deny();notify('NOT ENOUGH SHARDS')}
    })
  }else if(shopTab==='items'){
    const ids=Object.keys(ITEMS),R=cardRects(ids.length);
    ids.forEach((id,i)=>{
      if(!inR(x,y,R[i]))return;
      if(meta.shards>=ITEMS[id].price){meta.shards-=ITEMS[id].price;meta.items[id]++;S.buy();notify('+1 '+ITEMS[id].name);saveMeta()}
      else{S.deny();notify('NOT ENOUGH SHARDS')}
    })
  }else if(shopTab==='cache'){
    const B=cacheBuyRect();
    if(inR(x,y,B)){
      if(meta.shards>=CACHE_PRICE)openCache();
      else{S.deny();notify('NOT ENOUGH SHARDS')}
    }
  }else if(shopTab==='shards'){
    const R=cardRects(SHARD_PACKS.length);
    SHARD_PACKS.forEach((p,i)=>{
      if(!inR(x,y,R[i]))return;
      // [IAP] StoreKit purchase goes here. Prototype grants immediately.
      // Production: request product -> purchase -> validate receipt server-side
      //             -> server credits balance -> client refreshes from server.
      meta.shards+=p.amt;S.buy();notify('+'+p.amt+' SHARDS (SANDBOX)');saveMeta()
    })
  }
}
const SHARD_PACKS=[
  {amt:300, usd:'$0.99', label:'HANDFUL'},
  {amt:1000,usd:'$2.99', label:'POUCH',   bonus:'+11%'},
  {amt:2600,usd:'$6.99', label:'CACHE',   bonus:'+24%'},
  {amt:6000,usd:'$14.99',label:'HOARD',   bonus:'+32%'}
];
function cacheBuyRect(){const w=Math.min(W-40,300);return{x:W/2-w/2,y:H-116,w,h:48}}
function notify(t){toast=t;toastT=110}

function rollRarity(){
  meta.pity++;
  if(meta.pity>=PITY_AT){meta.pity=0;return Math.random()<.8?'epic':'legendary'}
  let r=Math.random(),acc=0;
  for(const[rar,p]of CACHE_ODDS){acc+=p;if(r<acc){if(rar==='epic'||rar==='legendary')meta.pity=0;return rar}}
  return 'common'
}
function openCache(){
  meta.shards-=CACHE_PRICE;meta.opens++;
  const rar=rollRarity();
  const pool=SKIN_IDS.filter(id=>SKINS[id].rar===rar);
  const pick=pool[~~(Math.random()*pool.length)];
  const dupe=meta.owned.includes(pick);
  if(dupe)meta.shards+=DUPE_REFUND[rar];else meta.owned.push(pick);
  saveMeta();S.cacheOpen();
  cacheAnim={t:0,skin:pick,rar,dupe,refund:DUPE_REFUND[rar],revealed:false};
  gs='cache'
}

// ============ PARTICLES / ENEMIES ============
class Pt{
  constructor(x,y,vx,vy,l,s,c){this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.l=l;this.ml=l;this.s=s;this.c=c}
  tick(){this.x+=this.vx;this.y+=this.vy;this.vx*=.91;this.vy*=.91;this.s=Math.max(.01,this.s*this.l/this.ml);return--this.l>0}
  draw(){ctx.save();ctx.globalAlpha=this.l/this.ml;ctx.fillStyle=this.c;ctx.beginPath();ctx.arc(this.x,this.y,this.s,0,Math.PI*2);ctx.fill();ctx.restore()}
}
function bleed(x,y,n,c='#cc0000'){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=.7+Math.random()*4.5;pts.push(new Pt(x,y,Math.cos(a)*v,Math.sin(a)*v,16+~~(Math.random()*24),1.3+Math.random()*2.3,c))}}
const ED={SH:{hp:3,spd:2.4,sz:13,pt:100,c:'#cc0000'},BL:{hp:12,spd:.9,sz:21,pt:150,c:'#770000'},RU:{hp:6,spd:1.65,sz:17,pt:200,c:'#ff4400'},LE:{hp:15,spd:.75,sz:20,pt:250,c:'#880000'},GA:{hp:5,spd:0,sz:11,pt:350,c:'#ff1111'}};
function mkE(t){
  const d=ED[t],m=38,s=~~(Math.random()*4);let x,y;
  if(s===0){x=Math.random()*W;y=-m}else if(s===1){x=W+m;y=Math.random()*H}else if(s===2){x=Math.random()*W;y=H+m}else{x=-m;y=Math.random()*H}
  return{t,x,y,hp:d.hp,mhp:d.hp,spd:d.spd*(1+wv*.05),sz:d.sz,pt:d.pt,c:d.c,ang:0,ph:Math.random()*Math.PI*2,ht:0,bp:null,pT:0,dC:60+~~(Math.random()*40),dvx:0,dvy:0,ds:false,dT:0,ph2:[],sT:180+~~(Math.random()*90),ob:0}
}
function bldWv(){
  wvQ=[];wi=0;sTm=0;
  if(wv%10===0){bossWave=true;spawnBoss();return}
  bossWave=false;
  const a=(t,n)=>{for(let i=0;i<n;i++)wvQ.push(t)};
  a('SH',2+Math.ceil(wv*1.1));
  if(wv>=2)a('BL',Math.ceil(wv*.55));
  if(wv>=3)a('RU',Math.ceil(wv*.4));
  if(wv>=4)a('LE',Math.ceil(wv*.22));
  if(wv>=5)a('GA',Math.ceil(wv*.3));
  wvQ.sort(()=>Math.random()-.5)
}
function spawnBoss(){
  const bn=Math.floor(wv/10),hp=110+(bn-1)*70;
  boss={x:W/2,y:-90,tx:W/2,ty:H*.26,hp,mhp:hp,sz:54,phase:1,beat:0,atk:null,atkCd:150,tele:0,atkT:0,beamAng:0,ht:0,entering:true,bn};
  bbz=[];S.roar()
}
function startGame(){
  sc=0;mul=1;wv=1;pCd=0;sCd=0;wPz=80;shA=0;shD=0;
  blts=[];enms=[];pts=[];pls=[];bbz=[];
  boss=null;bossWave=false;usedRevive=false;reviveT=0;adT=0;newBest=false;
  runMods={charge:meta.items.charge>0,hull:meta.items.hull>0,chance:meta.items.chance>0};
  if(runMods.charge){meta.items.charge--}
  if(runMods.hull){meta.items.hull--}
  saveMeta();
  const mhp=runMods.hull?7:5;
  pl={x:W/2,y:H/2,hp:mhp,mhp,inv:0,ang:0,sz:11};
  mouse.x=W/2;mouse.y=H/2-100;bldWv();gs='play'
}
function endRun(){
  newBest=false;
  const earned=Math.floor(sc/400);
  if(earned>0)meta.shards+=earned;
  if(sc>meta.best){meta.best=sc;newBest=true;S.bestS()}
  saveMeta();gs='over'
}
function doPulse(){
  if(gs!=='play'||pCd>0)return;
  pCd=430;const r=130,dk=[];S.pulse();
  enms.forEach((e,i)=>{
    if(Math.hypot(e.x-pl.x,e.y-pl.y)<r){
      const a=Math.atan2(e.y-pl.y,e.x-pl.x);e.hp-=4;e.x+=Math.cos(a)*55;e.y+=Math.sin(a)*55;bleed(e.x,e.y,10,e.c);
      if(e.hp<=0){sc+=e.pt*mul;bleed(e.x,e.y,20,e.c);dk.push(i)}
    }
  });
  enms=enms.filter((_,i)=>!dk.includes(i));

  NEBULAS.forEach(n=>{const x=n.fx*W,y=n.fy*H,r=n.fr*Math.min(W,H);const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`hsla(${n.hue},80%,10%,${n.al*2.9})`);g.addColorStop(.45,`hsla(${n.hue},55%,5%,${n.al})`);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()});
  ctx.save();ctx.globalAlpha=.014;ctx.translate(W*.5,H*.5);
  for(let arm=0;arm<3;arm++){ctx.beginPath();for(let i=0;i<=65;i++){const t=i/65,a=arm/3*Math.PI*2+t*Math.PI*3.6+fc*.0006,rr=16+t*Math.min(W,H)*.34;i===0?ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr):ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.strokeStyle=`rgba(${arm===0?'170,0,0':arm===1?'90,0,80':'0,0,110'},.75)`;ctx.lineWidth=arm===0?3.5:2.5;ctx.stroke()}
  const cg=ctx.createRadialGradient(0,0,0,0,0,Math.min(W,H)*.14);cg.addColorStop(0,'hsla(0,70%,8%,.22)');cg.addColorStop(.5,'hsla(10,50%,4%,.1)');cg.addColorStop(1,'transparent');ctx.fillStyle=cg;ctx.beginPath();ctx.arc(0,0,Math.min(W,H)*.14,0,Math.PI*2);ctx.fill();ctx.restore();
  STARS.forEach(s=>{s.tw+=s.tsp;const x=s.fx*W,y=s.fy*H,a=Math.max(0,Math.min(1,s.bright*.6+Math.sin(s.tw)*.4)),col=s.h<0?`hsl(0,0%,${s.l}%)`:`hsl(${s.h},${s.s}%,${s.l}%)`;ctx.save();ctx.globalAlpha=a;ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,s.r,0,Math.PI*2);ctx.fill();if(s.r>1.15){ctx.globalAlpha=a*.11;ctx.beginPath();ctx.arc(x,y,s.r*4,0,Math.PI*2);ctx.fill()}ctx.restore()})
}

  if(!rdy){ctx.globalAlpha=.3;ctx.beginPath();ctx.moveTo(pb.x,pb.y);ctx.arc(pb.x,pb.y,pb.r,-Math.PI/2,-Math.PI/2+(1-pCd/430)*Math.PI*2);ctx.closePath();ctx.fillStyle='#fff';ctx.fill()}
  ctx.globalAlpha=rdy?.8:.3;ctx.fillStyle='#fff';ctx.font='10px Courier New';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('PULSE',pb.x,pb.y);ctx.textBaseline='alphabetic';ctx.restore()
}
function drawFrozen(){
  pls.forEach(p=>{ctx.save();ctx.globalAlpha=p.l/p.ml*.27;ctx.fillStyle='#550000';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.restore()});
  pts.forEach(p=>p.draw());enms.forEach(drE);if(boss)drBoss();bbz.forEach(drawBossBullet);
  blts.forEach(b=>{ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,3,0,Math.PI*2);ctx.fill()});
  drawPlayer()
}

// ============ LOOP ============
function loop(){
  requestAnimationFrame(loop);fc++;if(toastT>0)toastT--;
  let sx=0,sy=0;if(shD>0){sx=(Math.random()-.5)*shA;sy=(Math.random()-.5)*shA;if(!--shD)shA=0}
  ctx.save();ctx.translate(sx,sy);
  drawGalaxy();

  if(gs==='menu'){drMenu();scan();ctx.restore();return}
  if(gs==='shop'){drShop();scan();ctx.restore();return}
  if(gs==='cache'){drawCacheReveal();scan();ctx.restore();return}
  if(gs==='pause'){drawFrozen();drawFrame();drawPause();scan();ctx.restore();return}
  if(gs==='revive'){drawFrozen();drawRevive();if(--reviveT<=0)endRun();scan();ctx.restore();return}
  if(gs==='ad'){drawFrozen();drawAd();if(--adT<=0)doRevive();scan();ctx.restore();return}
  if(gs==='over'){
    pls=pls.filter(p=>{ctx.save();ctx.globalAlpha=p.l/p.ml*.27;ctx.fillStyle='#550000';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.restore();return--p.l>0});
    pts=pts.filter(p=>p.tick());pts.forEach(p=>p.draw());drOver();scan();ctx.restore();return
  }

  if(!bossWave&&wi<wvQ.length&&--sTm<=0){sTm=Math.max(22,78-wv*5);enms.push(mkE(wvQ[wi]));wi++}
  if(bossWave){if(!boss&&enms.length===0&&--wPz<=0){wv++;bldWv();wPz=110;S.wave()}}
  else if(wi>=wvQ.length&&enms.length===0&&--wPz<=0){wv++;bldWv();wPz=95;S.wave()}

  let mx=0,my=0;
  if(keys.KeyA||keys.ArrowLeft)mx--;if(keys.KeyD||keys.ArrowRight)mx++;
  if(keys.KeyW||keys.ArrowUp)my--;if(keys.KeyS||keys.ArrowDown)my++;
  if(mx&&my){mx*=.707;my*=.707}
  if(stick.active){const dx=stick.x-stick.ox,dy=stick.y-stick.oy,d=Math.hypot(dx,dy);if(d>8){const k=Math.min(d,46)/46;mx=dx/d*k;my=dy/d*k}}
  pl.x=Math.max(pl.sz,Math.min(W-pl.sz,pl.x+mx*3.8));
  pl.y=Math.max(pl.sz,Math.min(H-pl.sz,pl.y+my*3.8));
  if(TOUCH){
    let nb=null,nd=1e9;
    enms.forEach(e=>{const d=Math.hypot(e.x-pl.x,e.y-pl.y);if(d<nd){nd=d;nb=e}});
    if(boss&&!boss.entering){const d=Math.hypot(boss.x-pl.x,boss.y-pl.y);if(d<nd){nd=d;nb=boss}}
    if(nb){const ta=Math.atan2(nb.y-pl.y,nb.x-pl.x);let df=ta-pl.ang;while(df>Math.PI)df-=Math.PI*2;while(df<-Math.PI)df+=Math.PI*2;pl.ang+=df*.22}
  }else pl.ang=Math.atan2(mouse.y-pl.y,mouse.x-pl.x);
  if(pl.inv>0)pl.inv--;if(pCd>0)pCd--;

  const rate=Math.max(5,10-~~(wv*.28))*(runMods.charge?.6:1);
  if(--sCd<=0){sCd=rate;blts.push({x:pl.x,y:pl.y,vx:Math.cos(pl.ang)*9.5,vy:Math.sin(pl.ang)*9.5,l:65,tr:[]});S.shoot()}
  blts=blts.filter(b=>{b.tr.push({x:b.x,y:b.y});if(b.tr.length>6)b.tr.shift();b.x+=b.vx;b.y+=b.vy;return--b.l>0&&b.x>-50&&b.x<W+50&&b.y>-50&&b.y<H+50});

  enms.forEach(upE);
  if(boss)upBoss();
  bbz=bbz.filter(p=>{p.x+=p.vx;p.y+=p.vy;if(Math.hypot(p.x-pl.x,p.y-pl.y)<p.sz+pl.sz-5){hitPl();return false}return--p.l>0&&p.x>-30&&p.x<W+30&&p.y>-30&&p.y<H+30});
  pls=pls.filter(p=>{if(Math.hypot(p.x-pl.x,p.y-pl.y)<p.r+pl.sz-5&&fc%44===0)hitPl();return--p.l>0});

  const dB=new Set(),dE=new Set();
  for(let bi=0;bi<blts.length;bi++){
    const b=blts[bi];
    for(let ei=0;ei<enms.length;ei++){
      if(dE.has(ei))continue;const e=enms[ei];
      if(Math.hypot(b.x-e.x,b.y-e.y)<e.sz+3){
        dB.add(bi);e.hp--;e.ht=9;bleed(b.x,b.y,6,e.c);S.hit();
        if(e.hp<=0){
          sc+=e.pt*mul;mul=Math.min(mul+1,16);
          if(e.t==='RU'){bleed(e.x,e.y,42,'#ff4400');bleed(e.x,e.y,22,'#cc0000');shk(12,22);S.boom();if(Math.hypot(e.x-pl.x,e.y-pl.y)<68)hitPl()}
          else{bleed(e.x,e.y,26,e.c);bleed(e.x,e.y,14);S.kill()}
          dE.add(ei)
        }break
      }
    }
  }
  if(boss&&!boss.entering){
    for(let bi=0;bi<blts.length;bi++){
      if(dB.has(bi))continue;const bl=blts[bi];
      if(Math.hypot(bl.x-boss.x,bl.y-boss.y)<boss.sz){dB.add(bi);boss.hp--;boss.ht=6;bleed(bl.x,bl.y,5,'#cc0000');S.bossTick();if(boss.hp<=0){killBoss();break}}
    }
  }
  blts=blts.filter((_,i)=>!dB.has(i));enms=enms.filter((_,i)=>!dE.has(i));
  enms.forEach(e=>{if(Math.hypot(e.x-pl.x,e.y-pl.y)<e.sz+pl.sz-4)hitPl()});
  pts=pts.filter(p=>p.tick());

  pls.forEach(p=>{ctx.save();ctx.globalAlpha=p.l/p.ml*.27;ctx.fillStyle='#550000';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.restore()});
  pts.forEach(p=>p.draw());
  enms.forEach(drE);
  if(boss)drBoss();
  bbz.forEach(drawBossBullet);
  blts.forEach(b=>{
    b.tr.forEach((pt,i)=>{ctx.save();ctx.globalAlpha=i/b.tr.length*.38;ctx.fillStyle=SKINS[meta.equip].thr;ctx.beginPath();ctx.arc(pt.x,pt.y,2,0,Math.PI*2);ctx.fill();ctx.restore()});
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,3,0,Math.PI*2);ctx.fill()
  });
  drawPlayer();drawFrame();drawTouchUI();

  if(pl.hp<=2){ctx.save();ctx.globalAlpha=.1+Math.sin(fc*.09)*.06;const vg=ctx.createRadialGradient(W/2,H/2,H*.15,W/2,H/2,H*.82);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(220,0,0,1)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);ctx.restore()}
  ctx.font='20px Courier New';ctx.fillStyle='#cc0000';ctx.textAlign='left';ctx.fillText(String(sc).padStart(8,'0'),12,32);
  if(mul>1){ctx.font='11px Courier New';ctx.fillStyle='#ff4444';ctx.fillText(`×${mul} MULTI`,12,49)}
  ctx.textAlign='right';ctx.fillStyle='#550000';ctx.font='10px Courier New';ctx.fillText(`WAVE ${wv}`,W-12,22);
  if(!bossWave){ctx.fillStyle='#380000';ctx.font='9px Courier New';ctx.fillText(`${Math.max(0,(wvQ.length-wi)+enms.length)} LEFT`,W-12,36)}
  if(boss){
    const bw=Math.min(W*.62,460),bx=W/2-bw/2,by=30;
    ctx.textAlign='center';ctx.font='9px Courier New';ctx.fillStyle='#ff4444';ctx.fillText('▲ THE HEART ▲',W/2,by-6);
    ctx.fillStyle='rgba(20,0,0,.7)';ctx.fillRect(bx-2,by-2,bw+4,12);
    ctx.fillStyle='#1a0000';ctx.fillRect(bx,by,bw,8);
    ctx.fillStyle='#cc0000';ctx.fillRect(bx,by,bw*(boss.hp/boss.mhp),8);
    ctx.fillStyle='#000';ctx.fillRect(bx+bw*.66,by,1,8);ctx.fillRect(bx+bw*.33,by,1,8)
  }
  ctx.textAlign='left';
  for(let i=0;i<pl.mhp;i++){ctx.fillStyle=i<pl.hp?'#cc0000':'#1a0000';ctx.fillRect(12+i*16,H-24,12,9)}
  if(runMods.charge){ctx.fillStyle='#ffaa33';ctx.font='8px Courier New';ctx.fillText('OVERCHARGED',12,H-32)}
  if(!TOUCH){
    ctx.textAlign='right';ctx.font='8px Courier New';ctx.fillStyle='#440000';ctx.fillText('PULSE [SPACE]',W-12,H-30);
    ctx.fillStyle='#110000';ctx.fillRect(W-102,H-24,90,9);ctx.fillStyle=pCd===0?'#fff':'#880000';ctx.fillRect(W-102,H-24,90*(1-pCd/430),9)
  }
  let wt='',wb=false;
  if(bossWave){if(!boss&&enms.length===0&&wPz>0)wt=`// WAVE ${wv+1} INCOMING //`}
  else if(wi>=wvQ.length&&enms.length===0&&wPz>0){if((wv+1)%10===0){wt='⚠  THE HEART APPROACHES  ⚠';wb=true}else wt=`// WAVE ${wv+1} INCOMING //`}
  if(wt){ctx.textAlign='center';ctx.font=wb?'bold 15px Courier New':'12px Courier New';ctx.fillStyle=wb?`rgba(255,30,30,${.6+Math.sin(fc*.15)*.35})`:'rgba(100,0,0,.9)';ctx.fillText(wt,W/2,H/2)}
  scan();ctx.restore()
}
loop()
</script>
