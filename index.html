<script>
'use strict';
/* ============================================================
   VOID v1.8.1 — EYES BUILD
   ------------------------------------------------------------
   FACE: the ship has worried, bloodshot eyeballs (FACE, ufoEyes). Whites and irises
     are cached textures (sclTex, irisTex); the iris foreshortens as it turns. The
     eyes stare along the aim (pl.gx/pl.gy, eased from pl.ang), blink with real lids,
     squeeze shut when hit (pl.ouch), go wide and bloodshot on the last hull point,
     and watch the cursor on the menu. Small on screen, they trade vessel detail
     for contrast (lod) so the stare still reads.
   LIGHT: ambient light from up-left (LIGHT), plus the ship's underglow. Every
     body casts a soft shadow onto the glass deck floor; near the ship, humans
     throw long shadows away from it.
   ------------------------------------------------------------
   PREMISE: you are the alien. Far-future cybernetic humans hunt your ship.
     Slicer, Brute, Overclock, Handler, Ronin, Enforcer, Carrier, Skitter, Sniper.
   ------------------------------------------------------------
   PROGRESSION:
     every 10 waves  fire rate levels up (x0.8 shot interval, floor 3 frames)
     waves 10,30,50  THE HEART
     waves 20,40,60  THE HOLLOW SOVEREIGN + original synthesized boss score
     every 5 waves   augment draft: pick 1 of 3 run upgrades
     every 20 waves  zone shift: Crimson Reach, Violet Deep, Bone Wastes
   DAILY RUN:
     seeded by UTC date; every player gets the same waves and augment
     offers. No items, no revive. Ranked by void-server when API_URL is set.
   ------------------------------------------------------------
   INTEGRATION TAGS (Ctrl+F):
     [BACKEND]  API_URL — set to your deployed void-server URL.
                Empty = offline: game, friends and challenges work,
                invite rewards stay locked.
     [SHARE]    canonical URL used in invite / challenge links
     [IAP]      StoreKit purchase call goes here
     [ADS]      rewarded ad SDK call
     [ODDS]     Apple Guideline 3.1.1 — odds shown before purchase. Keep.
   ENGINE NOTES:
     fixed 60Hz simulation, interpolated rendering on 90/120/144Hz
     pre-rendered backdrop, vignettes, enemy sprites, glow sprites
     persistent blood decal layer at device resolution
   ============================================================ */

// ===================== CONFIG =====================
const API_URL=''; // [BACKEND] e.g. 'https://void-referrals.fly.dev' (no trailing slash)
const GAME_URL='https://r0ck574r.github.io/Void/'; // [SHARE]
const VERSION='1.8.1',TAU=Math.PI*2,MAX_FRIENDS=50,SAVE_KEY='void_meta_v2',AUTH_KEY='void_auth_v1';
const RM=(()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}})();

// ===================== CANVAS =====================

const codeIn=document.getElementById('codeIn'),linkOut=document.getElementById('linkOut'),saEl=document.getElementById('sa');
function mkC(){const c=document.createElement('canvas');return[c,c.getContext('2d')]}
const [bgC,bgX]=mkC(),[decC,decX]=mkC(),[vigC,vigX]=mkC(),[redC,redX]=mkC();
let W=1,H=1,DPR=1,DECDPR=1;const SAFE={t:0,b:0,l:0,r:0};
const d2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy};
const rnd=(a,b)=>a+Math.random()*(b-a);
const inR=(x,y,r)=>!!r&&x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;
function compact(arr,keep){let j=0;for(let i=0;i<arr.length;i++){const o=arr[i];if(keep(o,i))arr[j++]=o}arr.length=j}
let AL=1,interp=false;
const ix=o=>o.px===undefined?o.x:o.px+(o.x-o.px)*AL;
const iy=o=>o.py===undefined?o.y:o.py+(o.y-o.py)*AL;
const HDR=()=>96+SAFE.t;

// ===================== STATE =====================
let gs='menu',fc=0,ready=false,fadeT=0;
let sc=0,dispSc=0,mul=1,maxMul=1,wv=1,pCd=0,sCd=0,sTm=0,wPz=0,trauma=0,hitstop=0,hurtF=0,runTicks=0;
let pl=null,blts=[],enms=[],pls=[],bbz=[],boss=null,bossWave=false,wvQ=[],wi=0;
let usedRevive=false,reviveT=0,adT=0,newBest=false,lastEarned=0,beatChallenge=false;
let runMods={charge:false,hull:false};
let shopTab='skins',scrollY=0,toast='',toastT=0,cacheAnim=null,buyArm=null,unlockAnim=null;
let addMode=false,linkShown=false,rmArm=null,challenge=null;
let rateUp=null,bnr=null;
const SLAMS=[];
const fireTier=()=>Math.floor(wv/10);
const baseInterval=lv=>Math.max(3,10*Math.pow(.8,lv)); // frames between shots
const fireInterval=()=>baseInterval(fireTier())*(runMods.charge?.6:1)*Math.pow(.87,ul('overdrive'));
const pulseMax=()=>Math.round(430*(1-.2*ul('capacitor')));
const pulseRad=()=>130*(1+.15*ul('capacitor'));

// ===================== RUN RNG =====================
// Daily runs share a seed. Waves draw from a per-wave stream and drafts from a
// per-draft stream, so every player meets the same enemies and offers that day.
function mb32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function h32(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const utcDay=(t=Date.now())=>new Date(t).toISOString().slice(0,10);
const dailySeed=day=>h32('VOID-DAILY-'+day);
let RUN={seed:1,daily:null,runId:null,drafts:0,drafted:0,result:null,ranked:false};
let WR=Math.random;

// ===================== AUGMENTS (pick 1 of 3 every 5 waves) =====================

  ricochet:{name:'RICOCHET',max:3,col:'#7ad8ff',d:l=>'Shots bounce to '+l+' more '+(l>1?'targets':'target')},
  heavy:{name:'HEAVY ROUNDS',max:3,col:'#ff6a6a',d:l=>'+'+(l*40)+'% damage'},
  crit:{name:'HOLLOW POINTS',max:3,col:'#ffe04a',d:l=>(l*10)+'% chance of triple damage'},
  overdrive:{name:'OVERDRIVE',max:3,col:'#ffb040',d:l=>'+'+Math.round((Math.pow(1/.87,l)-1)*100)+'% fire rate'},
  velocity:{name:'RAIL COILS',max:2,col:'#c8e0ff',d:l=>'+'+(l*30)+'% shot speed and range'},
  blades:{name:'ORBIT BLADES',max:3,col:'#d8ccb0',d:l=>l+(l>1?' bone blades orbit':' bone blade orbits')+' you and cut bullets'},
  burst:{name:'CORPSE BURST',max:3,col:'#ff3030',d:l=>[0,30,60,100][l]+'% of kills explode'},

  plating:{name:'BONE PLATING',max:3,col:'#e8dec6',d:l=>'+'+l+' max integrity'},
  thrust:{name:'THRUSTERS',max:2,col:'#9ab8ff',d:l=>'+'+(l*12)+'% move speed'},
  capacitor:{name:'CAPACITOR',max:3,col:'#ffffff',d:l=>'Pulse recharges '+(l*20)+'% faster, +'+(l*15)+'% radius'}
};
const UPG_IDS=Object.keys(UPG);
let U={},draft=null,kills=0,leechN=0;
const BURSTS=[],BL=[];
function ul(k){return U[k]||0}

// ===================== DAILY STATE =====================
const DAILY={day:null,board:null,tab:'friends',loading:false,err:'',last:0,starting:false};
const unlockQ=[];
const P=[],G=[],RG=[];
const keys={},mouse={x:0,y:0};
const stick={active:false,id:null,ox:0,oy:0,x:0,y:0};
const tp={id:null,sx:0,sy:0,s0:0,moved:false};
let usingTouch=false;

// ===================== CATALOG (cosmetic only) =====================
const RAR={common:{n:'COMMON',c:'#8a8a8a'},rare:{n:'RARE',c:'#3a7fd5'},epic:{n:'EPIC',c:'#9b4dcc'},legendary:{n:'LEGENDARY',c:'#e8a020'},exclusive:{n:'EXCLUSIVE · INVITE',c:'#40ffd0'}};
const SKINS={
  saucer:{name:'CLASSIC SAUCER',rar:'common',price:0,hull:['#ffffff','#c8ccd4','#6b7280'],dome:['#ffffff','#8895a8'],core:'#ff0000',lit:'#ff2222',thr:'#ff3333'},
  crimson:{name:'CRIMSON',rar:'common',price:250,hull:['#ff8080','#a02020','#3a0808'],dome:['#ffb0b0','#802020'],core:'#ff2200',lit:'#ff5555',thr:'#ff2200'},
  rust:{name:'RUSTHULK',rar:'common',price:250,hull:['#d9a066','#8a5a2b','#3a2410'],dome:['#e8c090','#7a5030'],core:'#ff7a10',lit:'#ffaa33',thr:'#ff8811'},
  voidsteel:{name:'VOIDSTEEL',rar:'rare',price:600,hull:['#b0b6d0','#4a4f6a','#16182a'],dome:['#c8ccf0','#5a5f80'],core:'#8844ff',lit:'#aa66ff',thr:'#7733ee'},
  bone:{name:'BONE',rar:'rare',price:600,hull:['#f4ecd8','#c9bb99','#5a5040'],dome:['#fffaf0','#b0a488'],core:'#66ff88',lit:'#88ffaa',thr:'#55dd77'},
  nova:{name:'NOVA',rar:'epic',price:1200,hull:['#ffffff','#a8d8ff','#2a5a90'],dome:['#ffffff','#88c0f0'],core:'#00ddff',lit:'#66eeff',thr:'#00ccff'},
  heartblood:{name:'HEARTBLOOD',rar:'legendary',price:2500,hull:['#ff5555','#8a0000','#2a0000'],dome:['#ff8888','#600000'],core:'#ff0033',lit:'#ff3344',thr:'#cc0022',organic:true},
  phantom:{name:'PHANTOM',rar:'legendary',price:2500,hull:['#e8f4ff','#7a9ab0','#1a2a35'],dome:['#ffffff','#90b0c8'],core:'#ccffff',lit:'#aaddee',thr:'#88ccdd',ghost:true},
  kindred:{name:'KINDRED',rar:'exclusive',price:null,need:1,hull:['#e8fff8','#3fbfa0','#0a3a30'],dome:['#ffffff','#7fe0c8'],core:'#40ffd0',lit:'#80ffe0',thr:'#20e0b0',orbit:1,tether:true},
  hivemind:{name:'HIVEMIND',rar:'exclusive',price:null,need:5,hull:['#fff1c8','#b88a2a','#2a1a05'],dome:['#fff8e0','#c8a040'],core:'#ffcc33',lit:'#ffd866',thr:'#ffaa22',orbit:3}
};
const SKIN_IDS=Object.keys(SKINS);
const isExcl=id=>!!SKINS[id]&&SKINS[id].rar==='exclusive';
const ITEMS={
  chance:{name:'SECOND CHANCE',price:150,desc:'Revive once without an ad'},
  charge:{name:'OVERCHARGE',price:120,desc:'+40% fire rate for one run',arm:true},
  hull:{name:'REINFORCED HULL',price:180,desc:'Start one run with 7 integrity',arm:true}
};
const ITEM_IDS=Object.keys(ITEMS);
// [ODDS] must stay visible on the Cache tab before purchase. Exclusive skins never drop.
const CACHE_PRICE=300,PITY_AT=20;
const CACHE_ODDS=[['common',.60],['rare',.28],['epic',.095],['legendary',.025]];
const DUPE_REFUND={common:60,rare:150,epic:400,legendary:900};
const SHARD_PACKS=[{amt:300,usd:'$0.99',label:'HANDFUL'},{amt:1000,usd:'$2.99',label:'POUCH',bonus:'+11%'},{amt:2600,usd:'$6.99',label:'CACHE',bonus:'+24%'},{amt:6000,usd:'$14.99',label:'HOARD',bonus:'+32%'}];
const CODE_ALPH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const CODE_RE=/^[A-HJ-NP-Z2-9]{6}$/;

// ===================== SAVE DATA =====================
const META_DEF={shards:500,owned:['saucer'],equip:'saucer',items:{chance:0,charge:0,hull:0},arm:{charge:false,hull:false},pity:0,best:0,opens:0,pid:'',friends:[],invitedBy:null,shared:0,pendingRef:null,pendingRun:null,srv:null,daily:{day:'',best:0,wave:0,plays:0},pendingDaily:null};
const clone=o=>JSON.parse(JSON.stringify(o));
let meta=clone(META_DEF);
const _mem={};
const store={
  get(k){try{const v=localStorage.getItem(k);if(v!==null)return v}catch(e){}return _mem[k]===undefined?null:_mem[k]},
  set(k,v){_mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}
};
function saveMeta(){store.set(SAVE_KEY,JSON.stringify(meta))}
function sanitize(src){
  const m=clone(META_DEF);if(!src||typeof src!=='object')return m;
  const num=(v,d)=>{const n=+v;return Number.isFinite(n)&&n>=0?Math.floor(n):d};
  m.shards=num(src.shards,m.shards);m.best=num(src.best,0);m.opens=num(src.opens,0);m.shared=num(src.shared,0);
  m.pity=Math.min(PITY_AT-1,num(src.pity,0));
  if(Array.isArray(src.owned))m.owned=[...new Set(['saucer',...src.owned.filter(id=>typeof id==='string'&&SKINS[id])])];
  m.equip=typeof src.equip==='string'&&SKINS[src.equip]&&m.owned.includes(src.equip)?src.equip:'saucer';
  if(src.items&&typeof src.items==='object')for(const k of ITEM_IDS)m.items[k]=num(src.items[k],0);
  m.arm.charge=!!(src.arm&&src.arm.charge===true)&&m.items.charge>0;
  m.arm.hull=!!(src.arm&&src.arm.hull===true)&&m.items.hull>0;
  if(typeof src.pid==='string'&&CODE_RE.test(src.pid))m.pid=src.pid;
  if(typeof src.invitedBy==='string'&&CODE_RE.test(src.invitedBy))m.invitedBy=src.invitedBy;
  if(typeof src.pendingRef==='string'&&CODE_RE.test(src.pendingRef))m.pendingRef=src.pendingRef;
  const r=src.pendingRun;
  if(r&&typeof r==='object'&&Number.isInteger(r.score)&&Number.isInteger(r.wave)&&Number.isInteger(r.seconds)&&r.score>=0&&r.wave>=1&&r.seconds>=0)m.pendingRun={score:r.score,wave:r.wave,seconds:r.seconds};
  m.srv=cleanSrv(src.srv);
  const dd=src.daily;if(dd&&typeof dd==='object'&&typeof dd.day==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(dd.day))m.daily={day:dd.day,best:num(dd.best,0),wave:num(dd.wave,0),plays:num(dd.plays,0)};
  const pd=src.pendingDaily;if(pd&&typeof pd==='object'&&typeof pd.runId==='string'&&pd.runId.length<64&&Number.isInteger(pd.score)&&Number.isInteger(pd.wave)&&Number.isInteger(pd.seconds))m.pendingDaily={runId:pd.runId,score:pd.score,wave:pd.wave,seconds:pd.seconds};
  if(Array.isArray(src.friends)){const seen=new Set();for(const f of src.friends){if(!f||typeof f.code!=='string'||!CODE_RE.test(f.code)||f.code===m.pid||seen.has(f.code))continue;seen.add(f.code);m.friends.push({code:f.code,since:num(f.since,Date.now()),via:['invite','code','inviter'].includes(f.via)?f.via:'code'});if(m.friends.length>=MAX_FRIENDS)break}}
  return m;
}
function cleanSrv(s){
  if(!s||typeof s!=='object')return null;
  const n=v=>Number.isInteger(v)&&v>=0?v:0;
  return{
    inviteState:['none','pending','qualified'].includes(s.inviteState)?s.inviteState:'none',
    invitedBy:typeof s.invitedBy==='string'&&CODE_RE.test(s.invitedBy)?s.invitedBy:null,
    qualified:n(s.qualified),qualWave:Number.isInteger(s.qualWave)&&s.qualWave>0?s.qualWave:3,
    invitees:Array.isArray(s.invitees)?s.invitees.filter(v=>v&&typeof v.code==='string'&&CODE_RE.test(v.code)).slice(0,500).map(v=>({code:v.code,state:v.state==='qualified'?'qualified':'pending'})):[]
  };
}
function genCode(){const b=new Uint8Array(6);if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(b);else for(let i=0;i<6;i++)b[i]=Math.floor(Math.random()*256);let s='';for(let i=0;i<6;i++)s+=CODE_ALPH[b[i]%32];return s}
function readParams(){try{const p=new URLSearchParams(location.search);const r=(p.get('ref')||'').toUpperCase(),c=parseInt(p.get('c')||'',10);return{ref:CODE_RE.test(r)?r:null,c:Number.isFinite(c)&&c>0&&c<1e9?c:null}}catch(e){return{ref:null,c:null}}}
function addFriendIfMissing(code,via){if(!CODE_RE.test(code)||code===meta.pid||meta.friends.some(f=>f.code===code)||meta.friends.length>=MAX_FRIENDS)return false;meta.friends.push({code,since:Date.now(),via});return true}
function applyParams(){
  const p=readParams();if(!p.ref||p.ref===meta.pid)return;
  if(!meta.invitedBy){notify('INVITED BY '+p.ref);if(!meta.pendingRef)meta.pendingRef=p.ref}
  addFriendIfMissing(p.ref,'inviter');
  if(p.c)challenge={from:p.ref,score:p.c};
}

// ===================== NETWORK (invite rewards) =====================
// [BACKEND] Talks to void-server. The server is the only thing that can unlock
// exclusive skins; the client just mirrors what it says.
const NET={busy:false,again:false,ok:false,tried:false,last:0};
let auth=null;
function loadAuth(){try{const a=JSON.parse(store.get(AUTH_KEY)||'null');if(a&&a.api===API_URL&&CODE_RE.test(a.pid)&&typeof a.token==='string'&&a.token.length>=20&&a.token.length<=100)auth=a}catch(e){auth=null}}
function saveAuth(){store.set(AUTH_KEY,JSON.stringify(auth))}
async function api(method,path,body){
  const ctl=typeof AbortController==='function'?new AbortController():null,t=setTimeout(()=>{if(ctl)ctl.abort()},8000);
  try{
    const h={'Content-Type':'application/json'};if(auth)h.Authorization='Bearer '+auth.token;
    const r=await fetch(API_URL+path,{method,headers:h,body:body?JSON.stringify(body):undefined,signal:ctl?ctl.signal:undefined});
    let j=null;try{j=await r.json()}catch(e){}
    if(!r.ok){const e=new Error((j&&j.error)||('http_'+r.status));e.status=r.status;e.msg=j&&j.message;throw e}
    NET.ok=true;return j||{};
  }catch(e){if(!e.status)NET.ok=false;throw e}finally{clearTimeout(t)}
}
async function netSync(){
  if(!API_URL)return;
  if(NET.busy){NET.again=true;return}
  NET.busy=true;NET.tried=true;
  try{
    do{
      NET.again=false;
      if(!auth){const j=await api('POST','/v1/register',{pid:meta.pid});auth={api:API_URL,pid:j.me.pid,token:j.token};saveAuth();applyMe(j.me)}
      else{try{applyMe((await api('GET','/v1/me')).me)}catch(e){if(e.status===401){auth=null;saveAuth();NET.again=true;continue}throw e}}
      if(meta.pendingRef){
        const ref=meta.pendingRef;
        try{applyMe((await api('POST','/v1/referral',{ref})).me);meta.pendingRef=null;saveMeta();notify('JOINED '+ref+"'S INVITE")}
        catch(e){if(e.status&&e.status<500){meta.pendingRef=null;saveMeta();if(e.status!==409||e.message!=='already_invited')notify((e.msg||'INVITE NOT APPLIED').toUpperCase())}else throw e}
      }
      if(meta.pendingRun){
        const run=meta.pendingRun;
        try{applyMe((await api('POST','/v1/run',run)).me);if(meta.pendingRun===run)meta.pendingRun=null;saveMeta()}
        catch(e){if(e.status&&e.status<500){meta.pendingRun=null;saveMeta()}else throw e}
      }
      if(meta.pendingDaily){
        const sub=meta.pendingDaily;
        try{const r=await api('POST','/v1/daily/submit',sub);if(meta.pendingDaily===sub)meta.pendingDaily=null;saveMeta();if(RUN.runId===sub.runId)RUN.result=r;DAILY.last=0}
        catch(e){if(e.status&&e.status<500){if(meta.pendingDaily===sub)meta.pendingDaily=null;saveMeta();if(RUN.runId===sub.runId)RUN.result={error:(e.msg||'Score not accepted').toUpperCase()}}else throw e}
      }
    }while(NET.again);
  }catch(e){}
  finally{NET.busy=false;NET.last=Date.now()}
}
function applyMe(me){
  if(!me||typeof me!=='object')return;
  if(typeof me.pid==='string'&&CODE_RE.test(me.pid))meta.pid=me.pid;
  const unlocks=Array.isArray(me.unlocks)?me.unlocks.filter(isExcl):[];
  const had=new Set(meta.owned);
  meta.owned=meta.owned.filter(id=>!isExcl(id)||unlocks.includes(id));
  for(const id of unlocks)if(!meta.owned.includes(id)){meta.owned.push(id);if(!had.has(id)&&!unlockQ.includes(id))unlockQ.push(id)}
  if(!meta.owned.includes(meta.equip))meta.equip='saucer';
  meta.srv=cleanSrv(me);
  if(meta.srv.invitedBy){meta.invitedBy=meta.srv.invitedBy;addFriendIfMissing(meta.srv.invitedBy,'inviter')}
  for(const iv of meta.srv.invitees)addFriendIfMissing(iv.code,'invite');
  saveMeta();
}
function queueRun(run){
  if(!API_URL)return;
  const p=meta.pendingRun;
  if(!p||run.wave>p.wave||(run.wave===p.wave&&run.seconds>p.seconds))meta.pendingRun=run;
  saveMeta();netSync();
}
async function dailyBoardFetch(){
  if(!API_URL||DAILY.loading)return;
  DAILY.loading=true;DAILY.last=Date.now();
  try{
    if(!auth)await netSync();

function rollRarity(){
  meta.pity++;

  const r=Math.random();let acc=0;
  for(const[rar,p]of CACHE_ODDS){acc+=p;if(r<acc){if(rar==='epic'||rar==='legendary')meta.pity=0;return rar}}

function cxy(e){const r=cvs.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
document.addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;
  keys[e.code]=true;
  if(e.code==='Space'||e.code.indexOf('Arrow')===0)e.preventDefault();
  if(e.repeat)return;
  initAudio();
  if(e.code==='Space')doPulse();
  else if(e.code==='KeyM')setMute(!A.muted);
  else if(gs==='draft'&&/^(Digit|Numpad)[123]$/.test(e.code))pickUpg(+e.code.slice(-1)-1);
  else if(e.code==='KeyP'||e.code==='Escape'){if(gs==='play')go('pause');else if(gs==='pause')go('play');else if(gs==='shop'||gs==='friends'||gs==='daily')go('menu');else if(gs==='unlock')closeUnlock()}
  else if(e.code==='KeyR'&&(gs==='over'||gs==='pause'))restartRun();
  else if(e.code==='Enter'&&gs==='menu')startGame();
  else if(e.code==='Enter'&&gs==='over')restartRun();
});
document.addEventListener('keyup',e=>{delete keys[e.code]});
window.addEventListener('blur',()=>{for(const k in keys)delete keys[k];if(gs==='play')go('pause')});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(gs==='play')go('pause');if(MUS.nodes&&A.ctx){const g=MUS.nodes.bus.gain;g.cancelScheduledValues(A.ctx.currentTime);g.setValueAtTime(.0001,A.ctx.currentTime);MUS.duck=-1}}else if(API_URL&&Date.now()-NET.last>10000)netSync()});
cvs.addEventListener('mousemove',e=>{usingTouch=false;const p=cxy(e);mouse.x=p.x;mouse.y=p.y});
cvs.addEventListener('mousedown',()=>initAudio());
cvs.addEventListener('click',e=>{
  initAudio();const p=cxy(e);mouse.x=p.x;mouse.y=p.y;
  if(gs==='play'){if(inR(p.x,p.y,pauseBtnRect())){S.ui();go('pause')}return}
  handleTap(p.x,p.y);
});
cvs.addEventListener('wheel',e=>{if(gs==='shop'||gs==='friends'||gs==='daily')scrollY=Math.max(0,scrollY+e.deltaY*.6)},{passive:true});
cvs.addEventListener('touchstart',e=>{
  e.preventDefault();usingTouch=true;initAudio();
  for(const t of e.changedTouches){
    const p=cxy(t);
    if(gs==='play'){
      if(inR(p.x,p.y,pauseBtnRect())){S.ui();go('pause');continue}
      const pb=pulseBtnRect();if(Math.hypot(p.x-pb.x,p.y-pb.y)<pb.r+14){doPulse();continue}
      if(!stick.active&&p.x<W*.6){stick.active=true;stick.id=t.identifier;stick.ox=p.x;stick.oy=p.y;stick.x=p.x;stick.y=p.y}
    }else if(tp.id===null){tp.id=t.identifier;tp.sx=p.x;tp.sy=p.y;tp.s0=scrollY;tp.moved=false}
  }
},{passive:false});
cvs.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    const p=cxy(t);
    if(t.identifier===stick.id){stick.x=p.x;stick.y=p.y}
    else if(t.identifier===tp.id){const dx=p.x-tp.sx,dy=p.y-tp.sy;if(Math.abs(dx)>10||Math.abs(dy)>10)tp.moved=true;if(gs==='shop'||gs==='friends'||gs==='daily')scrollY=Math.max(0,tp.s0-dy)}
  }
},{passive:false});
function touchEnd(e,cancel){
  e.preventDefault();initAudio();
  for(const t of e.changedTouches){
    if(t.identifier===stick.id){stick.active=false;stick.id=null}
    if(t.identifier===tp.id){const p=cxy(t);if(!cancel&&!tp.moved)handleTap(p.x,p.y);tp.id=null}
  }
}
cvs.addEventListener('touchend',e=>touchEnd(e,false),{passive:false});
cvs.addEventListener('touchcancel',e=>touchEnd(e,true),{passive:false});

function handleTap(x,y){
  if(!ready)return;
  if(linkShown){hideLink();return}
  if(gs==='menu'){const R=menuRects();
    if(inR(x,y,R.play)){S.ui();startGame()}
    else if(inR(x,y,R.shop)){S.ui();shopTab='skins';go('shop')}
    else if(inR(x,y,R.friends)){S.ui();go('friends')}
    else if(inR(x,y,R.daily)){S.ui();go('daily')}
    else if(inR(x,y,R.sound)){S.ui();setMute(!A.muted)}
  }else if(gs==='shop')handleShopTap(x,y);
  else if(gs==='friends')handleFriendsTap(x,y);
  else if(gs==='daily')handleDailyTap(x,y);
  else if(gs==='draft'){const R=draftRects(draft?draft.opts.length:0);for(let i=0;i<R.length;i++)if(inR(x,y,R[i])){pickUpg(i);break}}
  else if(gs==='cache'){if(cacheAnim&&cacheAnim.t>150){cacheAnim=null;go('shop')}}
  else if(gs==='unlock'){if(!unlockAnim||unlockAnim.t<70)return;const R=unlockRects();
    if(inR(x,y,R.equip)){meta.equip=unlockAnim.skin;saveMeta();S.buy();notify('EQUIPPED: '+SKINS[unlockAnim.skin].name);closeUnlock()}
    else if(inR(x,y,R.cont)){S.ui();closeUnlock()}
  }
  else if(gs==='pause'){const R=pauseRects();
    if(inR(x,y,R.resume)){S.ui();go('play')}
    else if(inR(x,y,R.sound)){S.ui();setMute(!A.muted)}
    else if(inR(x,y,R.restart)){S.ui();restartRun()}
    else if(inR(x,y,R.quit)){S.ui();endRun();go('menu')}
  }else if(gs==='revive'){const R=reviveRects();
    if(R.free&&inR(x,y,R.free)){if(meta.items.chance>0){meta.items.chance--;saveMeta();doRevive()}}
    else if(inR(x,y,R.yes)){S.ui();startAd()}
    else if(inR(x,y,R.no)){S.ui();endRun()}
  }else if(gs==='over'){const R=overRects();
    if(inR(x,y,R.again)){S.ui();restartRun()}
    else if(inR(x,y,R.share)){S.ui();shareLink('challenge')}
    else if(inR(x,y,R.shop)){S.ui();if(RUN.daily)go('daily');else{shopTab='skins';go('shop')}}
    else if(inR(x,y,R.menu)){S.ui();go('menu')}
  }
}
function handleShopTap(x,y){
  if(inR(x,y,backRect())){S.ui();go('menu');return}
  const T=shopTabRects();for(const k in T){if(inR(x,y,T[k])){if(shopTab!==k){S.ui();shopTab=k;scrollY=0;buyArm=null}return}}
  if(shopTab==='cache'){if(inR(x,y,cacheBuyRect())){if(meta.shards<CACHE_PRICE){S.deny();notify('NOT ENOUGH SHARDS')}else if(armed('cache'))openCache()}return}
  if(y<HDR())return;
  if(shopTab==='skins'){const R=listRects(SKIN_IDS.length,66);
    for(let i=0;i<R.length;i++){if(!inR(x,y,R[i]))continue;const id=SKIN_IDS[i],sk=SKINS[id];
      if(meta.owned.includes(id)){if(meta.equip!==id){meta.equip=id;S.buy();notify('EQUIPPED: '+sk.name);saveMeta()}}
      else if(isExcl(id)){S.ui();go('friends')}
      else if(meta.shards<sk.price){S.deny();notify('NOT ENOUGH SHARDS')}
      else if(armed('skin:'+id)){meta.shards-=sk.price;meta.owned.push(id);meta.equip=id;S.buy();notify('UNLOCKED: '+sk.name);saveMeta()}
      return}
  }else if(shopTab==='items'){const R=listRects(ITEM_IDS.length,88);
    for(let i=0;i<R.length;i++){const id=ITEM_IDS[i],it=ITEMS[id],r=R[i];
      if(inR(x,y,itemBuyRect(r))){if(meta.shards<it.price){S.deny();notify('NOT ENOUGH SHARDS')}else if(armed('item:'+id)){meta.shards-=it.price;meta.items[id]++;S.buy();notify('+1 '+it.name);saveMeta()}return}
      if(it.arm&&meta.items[id]>0&&inR(x,y,itemArmRect(r))){meta.arm[id]=!meta.arm[id];S.ui();saveMeta();return}}
  }else if(shopTab==='shards'){const R=listRects(SHARD_PACKS.length,66);
    for(let i=0;i<R.length;i++){if(!inR(x,y,R[i]))continue;const p=SHARD_PACKS[i];
      // [IAP] StoreKit: request product -> purchase sheet -> send receipt to YOUR server
      //       -> server validates with Apple -> server credits balance -> client refreshes.
      if(armed('pack:'+i)){meta.shards+=p.amt;S.buy();notify('+'+p.amt+' SHARDS (SANDBOX)');saveMeta()}
      return}
  }
}
function handleFriendsTap(x,y){
  if(addMode){const M=addModal();if(inR(x,y,M.ok))confirmAdd();else if(inR(x,y,M.cancel)||!inR(x,y,M.panel)){S.ui();cancelAdd()}return}
  if(inR(x,y,backRect())){S.ui();go('menu');return}
  if(y<HDR())return;
  const L=friendsLayout();
  if(inR(x,y,L.code)){copyText(meta.pid,'CODE COPIED');return}
  if(inR(x,y,L.invite)){S.ui();shareLink('invite');return}
  if(inR(x,y,L.add)){S.ui();openAdd();return}
  if(inR(x,y,L.rew)){if(API_URL&&!NET.busy){S.ui();notify('CHECKING INVITES…');netSync()}return}

      const crit=cc>0&&Math.random()<cc;if(crit)sparks(b.x,b.y,8,['#ffe04a','#fff4b0']);

  for(const e of enms){const rr=e.sz+pl.sz-4;if(d2(e.x,e.y,pl.x,pl.y)<rr*rr)hitPl()}

function update(){
  interp=false;

}

  }
  if(fadeT>0){ctx.globalAlpha=(fadeT/10)*(fadeT/10)*.7;ctx.fillStyle='#000000';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
  if(linkShown){const r=linkRect();ctx.textAlign='center';ctx.fillStyle='#88bbdd';ctx.font='9px Courier New';ctx.fillText('COPY THIS LINK  ·  TAP ANYWHERE TO CLOSE',W/2,r.y-8)}
  drawToast();
}

// ===================== LOOP / BOOT =====================
const STEP=1000/60;let last=0,acc=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!last)last=ts;let dt=ts-last;last=ts;if(dt>250)dt=250;acc+=dt;
  let n=0;while(acc>=STEP&&n<5){update();acc-=STEP;n++}if(n>=5)acc=0;
  AL=interp?Math.min(1,acc/STEP):1;
  render();
}
function boot(){
  let src=null;
  try{const raw=store.get(SAVE_KEY);if(raw)src=JSON.parse(raw)}catch(e){src=null}
  if(!src){try{const v1=store.get('void_meta');if(v1)src=JSON.parse(v1)}catch(e){src=null}}
  if(!src){const b=store.get('void_best');if(b)src={best:+b}}
  meta=sanitize(src);
  if(API_URL)loadAuth();
  if(auth)meta.pid=auth.pid;
  if(!meta.pid)meta.pid=genCode();
  applyParams();saveMeta();ready=true;
  netSync();
}
buildTextures();buildSprites();buildHumans();rsz();requestAnimationFrame(frame);boot();
</script>
